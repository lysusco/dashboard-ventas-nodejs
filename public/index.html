<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Ventas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f1f5f9; color: #0f172a; }
    header { background: #4f46e5; color: #fff; padding: 16px 24px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
    .card h3 { margin: 0 0 8px; color: #475569; font-size: .9rem; }
    .card .value { font-size: 1.6rem; font-weight: 700; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    canvas { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  </style>
</head>
<body>
  <header><h1>Dashboard de Ventas</h1></header>
  <div class="container">
    <div class="cards">
      <div class="card"><h3>Ventas hoy</h3><div class="value" id="hoy">$0</div></div>
      <div class="card"><h3>Ventas del mes</h3><div class="value" id="mes">$0</div></div>
      <div class="card"><h3>Cartera pendiente</h3><div class="value" id="cartera">$0</div></div>
    </div>
    <div class="grid">
      <canvas id="chartDias"></canvas>
      <canvas id="chartTop"></canvas>
    </div>
  </div>
  <script>
    async function load() {
      const r = await fetch('/api/ventas/resumen');
      const d = await r.json();
      document.getElementById('hoy').textContent = '$' + Number(d.hoy).toLocaleString();
      document.getElementById('mes').textContent = '$' + Number(d.mes).toLocaleString();
      document.getElementById('cartera').textContent = '$' + Number(d.cartera).toLocaleString();

      const dias = await (await fetch('/api/ventas/por-dia')).json();
      new Chart(document.getElementById('chartDias'), {
        type: 'bar',
        data: { labels: dias.map(x=>x.fecha).reverse(), datasets: [{ label: 'Ventas', data: dias.map(x=>x.total).reverse(), backgroundColor: '#4f46e5' }] }
      });

      const top = await (await fetch('/api/ventas/top-productos')).json();
      new Chart(document.getElementById('chartTop'), {
        type: 'doughnut',
        data: { labels: top.map(x=>x.nombre), datasets: [{ data: top.map(x=>x.cantidad), backgroundColor: ['#4f46e5','#06b6d4','#10b981','#f59e0b','#ef4444'] }] }
      });
    }
    load();
  </script>
</body>
</html>
